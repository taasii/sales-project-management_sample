<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン｜営業案件情報管理システム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html"><span class="logo"></span>営業案件情報管理システム</a>
      <nav class="header-nav" id="header-nav"></nav>
    </div>
  </header>

  <div class="sample-banner" role="note">
    <div class="sample-banner-title">サンプルシステム（デモ用プロトタイプ）</div>
    <div class="sample-banner-text">表示されている案件はすべて架空のデータです。実在の企業・案件とは関係ありません。</div>
  </div>

  <main class="container">
    <section class="card login-card">
      <h1>管理者ログイン</h1>
      <div class="login-info">
        <b>サンプルのため、ID・パスワードは固定です。</b><br>
        ID：<code>sample</code>　パスワード：<code>sample</code>
      </div>

      <div id="error-area"></div>

      <form id="login-form" autocomplete="off">
        <div class="field">
          <label for="login-id">ID</label>
          <input type="text" id="login-id" name="id" autocapitalize="off" spellcheck="false" placeholder="sample">
        </div>
        <div class="field">
          <label for="login-pw">パスワード</label>
          <input type="password" id="login-pw" name="pw" placeholder="sample">
        </div>
        <button type="submit" class="btn btn-primary">ログイン</button>
      </form>
      <p class="hint" style="text-align:center;margin-top:14px"><a href="index.html">← 案件一覧に戻る</a></p>
    </section>
  </main>

  <footer class="site-footer">社内DX改善提案用プロトタイプ ／ 掲載内容はすべて架空のサンプルです</footer>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
